appId: in.mellod.printap
productName: Printap
electronVersion: 33.4.11
publish:
  provider: github
  owner: alexDmello
  repo: printap
  releaseType: release
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/pdf-to-printer/**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Printap
  artifactName: "Printap-Setup-${version}.${ext}"
