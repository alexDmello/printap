name: Release Desktop Agent

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push a tag like 'v0.3.11'

permissions:
  contents: write # Required for electron-builder to upload to GitHub Releases

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Publish Release
        env:
          # GITHUB_TOKEN is automatically provided by GitHub Actions to upload the release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm -w packages/shared run build
          npm -w apps/desktop run build
          npx electron-builder --project apps/desktop --win -p always -c.extraMetadata.main=out/main/index.js
