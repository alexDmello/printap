name: Release Desktop Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Resolution Windows Icons
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/generate-icons.ps1

      - name: Build and Package Desktop Electron App
        run: npm run dist:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Release Asset File Names
        shell: powershell
        run: |
          Get-ChildItem "apps/desktop/dist/Printap Setup *.exe" | ForEach-Object { Copy-Item $_.FullName "apps/desktop/dist/Printap-Setup.exe" -Force }
          Get-ChildItem "apps/desktop/dist/Printap-Portable-*.exe" | ForEach-Object { Copy-Item $_.FullName "apps/desktop/dist/Printap-Portable.exe" -Force }

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Printap Desktop Agent ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            apps/desktop/dist/Printap-Setup.exe
            apps/desktop/dist/Printap-Portable.exe
            apps/desktop/dist/Printap Setup *.exe
            apps/desktop/dist/Printap-Portable-*.exe
            apps/desktop/dist/builder-effective-config.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
